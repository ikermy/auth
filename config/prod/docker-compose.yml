# =============================================================================
# docker-compose.yml — Auth Microservice: PROD-версия (config/prod)
#
# Auth — часть семейства микросервисов. Использует общую сеть barcode-shared и
# общие PostgreSQL/Redis/Kafka/envoy оркестратора bff. Собственные db/redis не
# поднимаются. Сборка на production-стадии (config/prod/Dockerfile).
#
# Запуск (из корня auth, bff должен быть поднят):
#   docker compose -f config/prod/docker-compose.yml up -d
# =============================================================================

services:
  app:
    container_name: auth_app
    image: "${AUTH_IMAGE:-auth:prod}"
    build:
      context: ../../
      dockerfile: config/prod/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    environment:
      GRPC_URL: "${GRPC_URL:-0.0.0.0:50051}"
      GRPC_PACKAGE: "${GRPC_PACKAGE:-auth}"
      # Общие ресурсы из bff
      DATABASE_URL: "${DATABASE_URL:-postgresql://billing:billing@postgres:5432/auth_db}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      KAFKA_BROKERS: "${KAFKA_BROKERS:-kafka:9092}"
      JWT_SUPER_SECRET_WORD: "${JWT_SUPER_SECRET_WORD:?JWT_SUPER_SECRET_WORD is required}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}"
      # Реальный токен бота обязателен в проде, иначе Auth отклоняет все входы через Telegram
      # ("TELEGRAM_BOT_TOKEN is not configured"). Задаётся из secrets.TELEGRAM_BOT_TOKEN в cd-pipeline.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}"
      TLS_ENABLED: "${TLS_ENABLED:-false}"
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      barcode-shared:
        aliases:
          - auth
          - auth-service

  # ── Observability (необязательно, в общей сети платформы) ─────────────
  prometheus:
    container_name: auth_prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - barcode-shared

  grafana:
    container_name: auth_grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - barcode-shared

volumes:
  prometheus_data:
  grafana_data:

networks:
  # Общая сеть платформы (docker network create barcode_shared)
  barcode-shared:
    external: true
    name: barcode_shared
